<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Realistic 3D Globe</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100">
    <div class="relative h-screen w-full overflow-hidden">
      <canvas id="globeCanvas" class="absolute inset-0 h-full w-full"></canvas>

      <div class="pointer-events-none absolute inset-0 flex items-start justify-center pt-8">
        <div class="rounded-xl border border-slate-700/60 bg-slate-900/50 px-4 py-2 backdrop-blur">
          <h1 class="text-sm font-semibold tracking-wide text-slate-100 md:text-base">Realistic 3D Globe</h1>
          <p class="text-xs text-slate-300">Drag to rotate, scroll to zoom</p>
        </div>
      </div>
    </div>

    <script type="module">
      import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.164/build/three.module.js";
      import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.164/examples/jsm/controls/OrbitControls.js";

      const canvas = document.getElementById("globeCanvas");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;

      const scene = new THREE.Scene();

      const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 0.2, 4.2);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.minDistance = 2.2;
      controls.maxDistance = 7;
      controls.autoRotate = true;
      controls.autoRotateSpeed = 0.35;

      scene.add(new THREE.AmbientLight(0x4f6a93, 0.32));

      const sun = new THREE.DirectionalLight(0xffffff, 1.7);
      sun.position.set(6, 3, 5);
      scene.add(sun);

      const rim = new THREE.DirectionalLight(0x6ea4ff, 0.55);
      rim.position.set(-6, -1, -4);
      scene.add(rim);

      const loader = new THREE.TextureLoader();
      const earthMap = loader.load("https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg");
      const normalMap = loader.load("https://threejs.org/examples/textures/planets/earth_normal_2048.jpg");
      const specularMap = loader.load("https://threejs.org/examples/textures/planets/earth_specular_2048.jpg");
      const cloudMap = loader.load("https://threejs.org/examples/textures/planets/earth_clouds_1024.png");
      const starsMap = loader.load("https://threejs.org/examples/textures/planets/galaxy_starfield.png");

      const globe = new THREE.Mesh(
        new THREE.SphereGeometry(1.45, 128, 128),
        new THREE.MeshStandardMaterial({
          map: earthMap,
          normalMap,
          roughness: 0.85,
          metalness: 0.05,
          specularMap,
        }),
      );
      scene.add(globe);

      const clouds = new THREE.Mesh(
        new THREE.SphereGeometry(1.465, 128, 128),
        new THREE.MeshPhongMaterial({
          map: cloudMap,
          transparent: true,
          opacity: 0.34,
          depthWrite: false,
        }),
      );
      scene.add(clouds);

      const atmosphere = new THREE.Mesh(
        new THREE.SphereGeometry(1.52, 128, 128),
        new THREE.ShaderMaterial({
          vertexShader: `
            varying vec3 vNormal;
            void main() {
              vNormal = normalize(normalMatrix * normal);
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
          `,
          fragmentShader: `
            varying vec3 vNormal;
            void main() {
              float i = pow(0.65 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 3.0);
              gl_FragColor = vec4(0.42, 0.66, 1.0, 1.0) * i;
            }
          `,
          side: THREE.BackSide,
          transparent: true,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
        }),
      );
      scene.add(atmosphere);

      const stars = new THREE.Mesh(
        new THREE.SphereGeometry(45, 64, 64),
        new THREE.MeshBasicMaterial({ map: starsMap, side: THREE.BackSide }),
      );
      scene.add(stars);

      function resize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      }

      window.addEventListener("resize", resize);

      const clock = new THREE.Clock();
      function animate() {
        requestAnimationFrame(animate);
        const dt = clock.getDelta();

        globe.rotation.y += dt * 0.08;
        clouds.rotation.y += dt * 0.11;
        stars.rotation.y += dt * 0.002;

        controls.update();
        renderer.render(scene, camera);
      }

      animate();
    </script>
  </body>
</html>
